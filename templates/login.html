{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-lg p-4">
            <h3 class="text-center fw-bold mb-1">Welcome Back</h3>
            <p class="text-center text-muted small mb-4">Sign in to access real estate portal features</p>
            
            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold mt-2 py-2">Sign In</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Don't have an account? <a href="/register" class="text-success fw-bold">Register</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
