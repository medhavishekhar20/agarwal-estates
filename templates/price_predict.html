{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card p-4 shadow-lg">
            <h3 class="fw-bold mb-3 text-center">Property Price Predictor</h3>
            
            <form method="POST" action="/price_predict">
                <div class="mb-3">
                    <label class="form-label fw-bold">Locality / Area</label>
                    <input type="text" name="location" class="form-control" placeholder="e.g. Whitefield" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Total Square Feet</label>
                    <input type="number" name="sqft" class="form-control" placeholder="e.g. 1200" required>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold">BHK</label>
                        <input type="number" name="bhk" class="form-control" placeholder="2" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold">Bathrooms</label>
                        <input type="number" name="bathrooms" class="form-control" placeholder="2" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Predict Price</button>
            </form>

            {% if prediction %}
                <div class="alert alert-success mt-4 text-center">
                    <h5 class="mb-1">Estimated Market Valuation</h5>
                    <h2 class="fw-bold text-success">{{ prediction.price }}</h2>
                    <small class="text-muted">For {{ prediction.sqft }} sqft, {{ prediction.bhk }} BHK in {{ prediction.location }}</small>
                </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
