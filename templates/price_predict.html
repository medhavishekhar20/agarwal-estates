{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Property Price Predictor</h2>
    <p class="text-muted">Estimate real estate valuation based on key features.</p>
    <div class="card p-4 shadow-sm mt-3">
        <form method="POST" action="/price_predict">
            <div class="mb-3">
                <label class="form-label">Locality / Area</label>
                <input type="text" name="location" class="form-control" placeholder="e.g. Whitefield" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Total Square Feet</label>
                <input type="number" name="sqft" class="form-control" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">BHK</label>
                    <input type="number" name="bhk" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Bathrooms</label>
                    <input type="number" name="bath" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Predict Price</button>
        </form>
    </div>
</div>
{% endblock %}
