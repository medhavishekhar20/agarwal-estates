<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRI Advisory Desk - Agarwal Estates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="#">Agarwal Estates</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/logout">Logout</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="card shadow-sm p-4 mb-5">
    <h2 class="mb-3">NRI Advisory Inquiry</h2>
    <form method="POST" action="/nri-desk">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="full_name" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Country</label>
          <input type="text" name="country" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Phone Number</label>
          <input type="text" name="phone" class="form-control" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Inquiry Details</label>
        <textarea name="details" class="form-control" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit Inquiry</button>
    </form>
  </div>

  <div class="card shadow-sm p-4">
    <h3 class="mb-3">My Submitted Inquiries</h3>
    <table class="table table-striped table-hover align-middle mt-2">
      <thead class="table-dark">
        <tr>
          <th>Date</th>
          <th>Details</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% for item in inquiries %}
        <tr>
          <td>{{ item['created_at'] }}</td>
          <td>{{ item['inquiry_details'] }}</td>
          <td><span class="badge bg-warning text-dark">{{ item['status'] }}</span></td>
        </tr>
        {% else %}
        <tr>
          <td colspan="3" class="text-center text-muted">No inquiries submitted yet.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
