<!-- Submission Form Above -->

<hr class="my-5">
<h3>My Submitted Inquiries</h3>
<table class="table table-bordered mt-3">
  <thead>
    <tr>
      <th>Date</th>
      <th>Details</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    {% for item in inquiries %}
    <tr>
      <td>{{ item['created_at'] }}</td>
      <td>{{ item['inquiry_details'] }}</td>
      <td><span class="badge bg-info">{{ item['status'] }}</span></td>
    </tr>
    {% else %}
    <tr>
      <td colspan="3" class="text-center">No inquiries submitted yet.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
