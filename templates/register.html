<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Agarwal Estates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .navbar {
            background-color: transparent !important;
        }
        .brand-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #28a745 !important;
            text-decoration: none;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            color: #333;
            max-width: 420px;
            margin: 60px auto;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .btn-custom {
            background-color: #00a86b;
            color: white;
            font-weight: 600;
        }
        .btn-custom:hover {
            background-color: #008f5a;
            color: white;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg px-4 pt-3">
    <div class="container-fluid">
        <a class="brand-logo" href="#">Agarwal Estates</a>
        <div class="ms-auto">
            <a href="/login" class="btn btn-outline-light me-2">Login</a>
            <a href="/register" class="btn btn-success">Register</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="login-card">
        <h3 class="text-center mb-4 font-weight-bold">Create Account</h3>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 text-center" role="alert">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/register">
            <div class="mb-3">
                <label class="form-label text-muted">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-muted">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Choose a password" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label text-muted">Register As</label>
                <select name="role" class="form-select" required>
                    <option value="buyer">User / Buyer</option>
                    <option value="employee">Employee</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-custom w-100 py-2">Register</button>
        </form>

        <p class="text-center mt-3 text-muted mb-0">
            Already have an account? <a href="/login" class="text-success text-decoration-none font-weight-bold">Sign In here</a>
        </p>
    </div>
</div>

</body>
</html>
