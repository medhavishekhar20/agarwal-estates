{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg p-4">
            <h3 class="text-center fw-bold mb-3">Create Account</h3>
            
            <form method="POST" action="/register">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter full name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create a password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Account Role</label>
                    <select name="role" class="form-select">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                        <option value="buyer">Buyer</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">Register</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Already have an account? <a href="/login" class="text-success fw-bold">Sign In</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
