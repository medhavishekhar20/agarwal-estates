{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Dataset Management (Admin Only)</h2>
            <p class="text-muted mb-0">Upload and inspect property market CSV datasets.</p>
        </div>
    </div>

    <!-- Upload Form Card -->
    <div class="card p-4 shadow-sm border-0 mb-4">
        <form method="POST" action="/dataset_management" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label fw-bold">Select Dataset CSV File</label>
                <input type="file" name="dataset_file" class="form-control" accept=".csv" required>
            </div>
            <button type="submit" class="btn btn-warning fw-bold text-dark px-4 py-2">
                <i class="bi bi-upload me-1"></i> Upload & View Data
            </button>
        </form>
    </div>

    <!-- Uploaded CSV Preview Section -->
    {% if table_html %}
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="fw-bold mb-0">Dataset Preview</h5>
            <div>
                <span class="badge bg-primary me-2">{{ row_count }} Rows</span>
                <span class="badge bg-secondary">{{ col_count }} Columns</span>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                {{ table_html|safe }}
            </div>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
