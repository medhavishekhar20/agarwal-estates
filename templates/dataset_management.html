{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Dataset Management (Admin Only)</h2>
    <p class="text-muted">Upload real estate dataset CSV files to retrain property prediction models.</p>
    <hr>

    {% if message %}
        <div class="alert alert-success">{{ message }}</div>
    {% endif %}

    <div class="card p-4 shadow-sm mt-3">
        <form method="POST" action="/dataset_management" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label fw-bold">Select Dataset CSV File</label>
                <input type="file" name="dataset_file" class="form-control" accept=".csv" required>
            </div>
            <button type="submit" class="btn btn-warning fw-bold">Upload & Train Model</button>
        </form>
    </div>
</div>
{% endblock %}
